name: gates

# 매 푸시·PR 마다 두 게이트를 돌린다. 사람이 잊어도 돌게 만드는 것이 목적이다
# (HANDOFF §6-3 · DEV_PLAN Phase 4-3).
#
# 게이트 두 개는 서로를 대신하지 못한다.
#   - tools/gate_all.py      : 문서·용어집·데이터·시뮬 (파이썬). Godot 를 부르지 않는다.
#   - tools/test_godot.sh    : GUT. 새 체크아웃은 임포트 캐시가 없어서 바로 돌리면
#                              "테스트 0건 + exit 0" 이 나온다 — 그래서 그 스크립트가
#                              임포트를 먼저 하고 junit 로 실제 실행을 확인한다.
# 여기서 그 스크립트를 그대로 부른다. CI 전용 우회로를 만들지 않는다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 런은 버린다 (게이트는 최신 트리만 보면 된다).
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # 로컬 실측 버전과 같은 값으로 고정한다 (`godot --version` = 4.7.2.stable.official).
  # 올릴 때는 SETUP.md·HANDOFF.md 의 버전 표기도 같은 커밋에서 고친다.
  GODOT_VERSION: "4.7.2-stable"

jobs:
  python-gates:
    name: gate_all (문서·데이터·시뮬)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 로컬 venv 는 3.9.6 이다 (자체 실측). 도구는 표준 라이브러리만 쓰므로
      # 같은 계열을 쓴다 — CI 에서만 3.12 문법이 통과하는 일을 막는다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: gate_all
        run: python tools/gate_all.py

  godot-tests:
    name: GUT (Godot 4.7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 편집기 빌드가 헤드리스로 떠도 공유 라이브러리는 필요하다 (Godot 리눅스 요구 목록).
      # 이걸 비우면 `godot` 이 "error while loading shared libraries" 로 바로 죽는다.
      - name: install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libfreetype6 libgl1 libxcursor1 libxinerama1 libxi6 \
            libxrandr2 libxkbcommon0 libdbus-1-3 libasound2t64 libpulse0 unzip

      - name: install godot
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL "$url" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          bin="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -name 'Godot_v*' -type f | head -1)"
          [ -n "$bin" ] || { echo "Godot 실행 파일을 찾지 못했습니다 ($url)" >&2; exit 1; }
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          # 스크립트는 PATH 의 `godot` 을 부른다 — 실제 이름이 버전마다 달라서 링크를 만든다.
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$bin" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: GUT
        run: ./tools/test_godot.sh

      # 실패했을 때만: 무엇이 왜 깨졌는지 볼 수 있게 junit 을 남긴다.
      - name: upload junit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: godot/.gut_junit.xml
          if-no-files-found: ignore
